name: Docker Build

# Builds and publishes the image to GHCR only; `make aws-deploy` copies it into ECR.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/docker-build.yml"
  schedule:
    # Sundays 12:00 UTC (7am CT), after Friday/Saturday games have finished.
    - cron: "0 12 * 8-12,1 0"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest game scores
        run: python scripts/update_scores.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=schedule,pattern={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: |
          image=$(echo '${{ steps.meta.outputs.tags }}' | head -1)
          docker run -d --name smoke -p 5000:5000 "$image"
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:5000/nebraska_football.png && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5000/nebraska_football.png
          docker rm -f smoke
