name: Terraform CI

on:
  push:
    paths:
      - "terraform/**"
      - "data/**"
      - "charts/**"
      - "tests/test_helm.py"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "data/**"
      - "charts/**"
      - "tests/test_helm.py"
      - ".github/workflows/terraform-ci.yml"

jobs:
  terraform:
    name: terraform (${{ matrix.cloud }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud: [aws, aws-eks, azure, gcp]
    defaults:
      run:
        working-directory: terraform/${{ matrix.cloud }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Mocked EKS Tests
        if: matrix.cloud == 'aws-eks'
        run: terraform test

  helm:
    name: Helm compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: python -m unittest discover -s tests -p test_helm.py -v
