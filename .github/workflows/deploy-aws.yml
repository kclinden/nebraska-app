name: Deploy to AWS

# Copies the GHCR image built by "Docker Build" into ECR and rolls out ECS.
# Failures here never affect the container build; it skips entirely when the AWS stack isn't linked.
on:
  workflow_run:
    workflows: ["Docker Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: nebraska-app
  ECS_CLUSTER: husker-app
  ECS_SERVICE: husker-app
  SOURCE_IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    # AWS_ROLE_ARN is set by `make gh-setup` and removed by `make aws-destroy`.
    if: >-
      vars.AWS_ROLE_ARN != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request'))
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy image to ECR
        env:
          TARGET: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker buildx imagetools create \
            -t "$TARGET:latest" \
            -t "$TARGET:sha-${SOURCE_IMAGE##*:sha-}" \
            "$SOURCE_IMAGE"

      - name: Roll out ECS
        run: |
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
