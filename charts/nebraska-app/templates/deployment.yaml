apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nebraska-app.fullname" . }}
  labels:
    {{- include "nebraska-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "nebraska-app.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "nebraska-app.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - secretRef:
                name: {{ include "nebraska-app.fullname" . }}-aws
            - secretRef:
                name: {{ .Values.auth.existingSecret | default (printf "%s-auth" (include "nebraska-app.fullname" .)) }}
          env:
            - name: SESSION_COOKIE_SECURE
              value: {{ .Values.auth.secureCookies | quote }}
          readinessProbe:
            httpGet:
              path: /nebraska_football.png
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nebraska_football.png
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "nebraska-app.restrictedContainer" . | nindent 12 }}
