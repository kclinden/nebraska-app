image:
  repository: ghcr.io/kclinden/nebraska-app
  tag: latest
  # Always re-check :latest; use IfNotPresent/Never with a locally built tag.
  pullPolicy: Always

applicationName: Husker-Roster-App

replicaCount: 1

sportsData:
  source: synced
  season: "2026"
  sync:
    enabled: true
    schedule: "*/15 * * * *"

serviceAccount:
  create: false
  name: ""

auth:
  existingSecret: ""
  sessionSecret: local-only-disposable-session-key
  adminPassword: local-admin-password
  viewerPassword: local-viewer-password
  secureCookies: false

service:
  type: ClusterIP
  port: 80
  nodePort: 32080

ingress:
  enabled: false
  className: ""
  host: nebraska-app.localhost

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# DynamoDB Local runs in-cluster; data is in-memory and resets when its pod restarts.
dynamodb:
  enabled: true
  image: amazon/dynamodb-local:latest
  region: us-east-1
  useStaticCredentials: true
  # Dummy credentials; DynamoDB Local doesn't validate them.
  accessKeyId: local
  secretAccessKey: local
  # When disabled, leave empty for managed DynamoDB; useStaticCredentials=false enables workload identity.
  externalEndpoint: ""
  tables:
    players: NebraskaPlayers
    schedule: NebraskaSchedule2026
    users: NebraskaUsers

# Post-install/upgrade Job that creates the tables and loads roster/schedule.
# The Makefile supplies these with --set-file from data/ and scripts/ so there is one source of truth.
seed:
  enabled: true
  image: python:3.12-slim
  script: ""
  roster: ""
  schedule: ""
